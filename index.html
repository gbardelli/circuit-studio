<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CircuitStudio</title>
    <style>html,body{margin:0;background:#0a0c0b}</style>
    <link rel="stylesheet" href="/src/brand.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..500&family=Instrument+Sans:wght@500..600&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#08090a" />
  </head>
  <body>
    <div id="root">
      <div class="brand-screen" role="status" aria-label="Cargando CircuitStudio">
        <div class="brand-field" aria-hidden="true"></div>
        <div class="brand-grain" aria-hidden="true"></div>
        <div class="brand-lockup" aria-hidden="true">
          <svg class="brand-signal" viewBox="0 0 32 32" fill="none">
            <path class="brand-signal-path" d="M6 20h4v-8h5v8h4v-8h3" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" />
            <circle class="brand-signal-node" cx="25" cy="12" r="1.8" fill="currentColor" />
          </svg>
          <div class="brand-name">CircuitStudio<span class="brand-name-period">.</span></div>
          <p class="brand-caption">De la idea al circuito.</p>
        </div>
        <span class="brand-signature" aria-hidden="true">CIRCUITSTUDIO / ESTUDIO DE CIRCUITOS</span>
      </div>
      <noscript><p style="position:fixed;bottom:64px;left:0;right:0;text-align:center;color:#bcc6bf;z-index:10001;font-family:system-ui">Activa JavaScript para abrir CircuitStudio.</p></noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
