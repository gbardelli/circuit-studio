# Despliegue automático a Vercel (cuenta 20250308-9812) en cada push a main.
# No usa la integración Git de Vercel: funciona con cualquier correo porque se autentica con un token.
# Necesita el secreto VERCEL_TOKEN y las variables VERCEL_ORG_ID y VERCEL_PROJECT_ID del repositorio.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # El lock se generó en Windows y le faltan dependencias opcionales de Linux: npm ci lo rechaza.
      - run: npm install --no-audit --no-fund
      - name: Tipos
        run: npx tsc --noEmit -p .
      - name: Instalar compilador Arduino
        run: npm run setup:arduino
      - name: Pruebas
        run: npx vitest run src/parts src/sim src/collab src/logic src/ui
      - name: No desplegar si algún proyecto usa piezas que esta versión no conoce
        run: |
          npx vercel env pull .env.production.local --environment=production --yes --token "$VERCEL_TOKEN"
          npx tsx scripts/check-part-types.ts
      - name: Desplegar a producción
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
